[package]
name = "onlykey-core"
description = "OnlyKey protocol, engine and data handling; pure Rust, no I/O."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
des = "0.8"
md-5 = "0.10"
pgp = { version = "0.21", default-features = false }
pkcs1 = "0.7"
pkcs8 = { version = "0.10", features = ["encryption", "3des", "sha1-insecure"] }
rand_core = "0.10.1"
sec1 = { version = "0.7", features = ["der"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ecdsa", "encryption"] }
url = "2"
zeroize = "1"

# pgp pulls getrandom 0.2 (via rand_core 0.6); wasm32 needs its `js` backend.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[features]
# `transport::MockDevice` / `MockRig` outside tests (demo backend).
mock = []

[lints]
workspace = true
