<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- No inline scripts: web/init.js starts the wasm (Trunk.web.toml turns off Trunk's inline loader). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>RustyKey</title>
    <link data-trunk rel="css" href="../style.css" />
    <link data-trunk rel="copy-dir" href="../assets" />
    <link data-trunk rel="copy-dir" href="icons" />
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-256.png" />
    <link
      data-trunk
      rel="rust"
      href="../Cargo.toml"
      data-bin="rustykey-ui"
      data-cargo-no-default-features
      data-cargo-features="web"
    />
    <link data-trunk rel="copy-file" href="init.js" />
    <script type="module" src="init.js"></script>
  </head>
  <body></body>
</html>
