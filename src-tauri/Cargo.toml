[package]
name = "rustykey"
description = "RustyKey desktop shell (Tauri)."
edition.workspace = true
version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["image-png", "tray-icon"] }
onlykey-core = { path = "../crates/onlykey-core" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1.0.154"
tauri-plugin-updater = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
zeroize = "1"

# hidapi backend per OS. Linux: hidraw (reports usage pages; libusb does not). macOS: open
# non-exclusively so other apps keep the key. Windows: the native backend.
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
# Tauri's tray uses tray-icon's AppIndicator backend, which never reports clicks. Turning on `ksni`
# switches tray-icon to its StatusNotifier backend (it wins when both are on; build prints a
# warning) so a left click can show the window.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }
[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[dev-dependencies]
# Canned responses for the firmware download size-cap test (`reqwest::Body::wrap_stream`).
futures-util = { version = "0.3", default-features = false }
http = "1"
onlykey-core = { path = "../crates/onlykey-core", features = ["mock"] }
sha2 = "0.10"
tauri = { version = "2.12", features = ["test"] }

[features]
# Dev aid: `RUSTYKEY_MOCK=classic|duo|uninitialized|bootloader` drives a simulated device.
mock = ["onlykey-core/mock"]

[lints]
workspace = true
